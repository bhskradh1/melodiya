name: Build Melodiya Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile npm lockfile with package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install web dependencies
        run: npm ci

      - name: Build web application for Android
        env:
          VITE_AUTH_REDIRECT_URL: ${{ vars.MELODIYA_AUTH_REDIRECT_URL || 'https://melodiya-your-sound.vercel.app/' }}
        run: npm run build

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: flutter_app/pubspec.yaml

      - name: Bundle the web app and generate Android project
        run: bash scripts/prepare-flutter-android.sh

      - name: Restore Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing required repository secret: ${secret_name}"
              exit 1
            fi
          done
          mkdir -p flutter_app/android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > flutter_app/android/app/melodiya-upload-key.p12
          test -s flutter_app/android/app/melodiya-upload-key.p12
          keytool -list -keystore flutter_app/android/app/melodiya-upload-key.p12 -storetype PKCS12 -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape_property(value):
              value = value.replace('\\', '\\\\').replace('\\n', '\\n').replace('\\r', '\\r')
              for char in (':', '=', '#', '!'):
                  value = value.replace(char, '\\' + char)
              if value.startswith(' '):
                  value = '\\' + value
              return value

          values = {
              'storeFile': 'app/melodiya-upload-key.p12',
              'storePassword': os.environ['ANDROID_STORE_PASSWORD'],
              'keyAlias': os.environ['ANDROID_KEY_ALIAS'],
              'keyPassword': os.environ['ANDROID_KEY_PASSWORD'],
          }
          target = Path('flutter_app/android/key.properties')
          target.write_text(chr(10).join(f'{key}={escape_property(value)}' for key, value in values.items()) + chr(10), encoding='utf-8')
          PY
          chmod 600 flutter_app/android/key.properties flutter_app/android/app/melodiya-upload-key.p12

      - name: Resolve Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build signed release APK
        working-directory: flutter_app
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Verify bundled web entry-point assets
        run: |
          python3 - <<'PY'
          import re
          import zipfile
          from pathlib import Path

          apk = Path('flutter_app/build/app/outputs/flutter-apk/app-release.apk')
          prefix = 'assets/flutter_assets/assets/web/'
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              html = archive.read(prefix + 'index.html').decode('utf-8')
              references = re.findall(r'(?:src|href)="(/assets/[^"]+)"', html)
              required = [prefix + item.lstrip('/') for item in references]
              missing = [item for item in required if item not in names]
              if missing:
                  raise SystemExit('APK is missing web entry-point assets: ' + ', '.join(missing))
              if not any(item.endswith('.js') for item in required):
                  raise SystemExit('No JavaScript bundle was referenced by index.html.')
              if not any(item.endswith('.css') for item in required):
                  raise SystemExit('No CSS bundle was referenced by index.html.')
              print('Verified bundled web assets:')
              for item in required:
                  print(' - ' + item)
          PY

      - name: Remove signing material
        if: always()
        run: rm -f flutter_app/android/key.properties flutter_app/android/app/melodiya-upload-key.p12

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: melodiya-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish in-app update to Supabase Storage
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: https://xdtgtwlpkgldszmufoay.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -n "$LATEST_MAIN_SHA" && "$GITHUB_SHA" != "$LATEST_MAIN_SHA" ]]; then
            echo "Skip publishing an outdated commit ($GITHUB_SHA); main is $LATEST_MAIN_SHA."
            exit 0
          fi
          : "${SUPABASE_SERVICE_KEY:?Missing repository secret SUPABASE_SERVICE_KEY}"
          APK="flutter_app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          export APK_SHA256
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          pubspec = Path('flutter_app/pubspec.yaml').read_text()
          match = re.search(r'^version:\s*([^\s]+)', pubspec, re.MULTILINE)
          if not match:
              raise SystemExit('Could not read the app version from pubspec.yaml.')
          version = match.group(1).split('+', 1)[0]
          build = int(os.environ['BUILD_NUMBER'])
          apk_name = 'melodiya-' + version + '-' + str(build) + '.apk'
          base = os.environ['SUPABASE_URL'].rstrip('/')
          manifest = {
              'appId': 'com.melodiya.melodiya_app',
              'version': version,
              'buildNumber': build,
              'apkUrl': base + '/storage/v1/object/public/melodiya-app-updates/' + apk_name,
              'sha256': os.environ['APK_SHA256'],
              'releaseNotes': 'Melodiya branding improvements, startup polish, and verified in-app updates.',
              'mandatory': False,
          }
          Path('melodiya-version.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Prepared update manifest for build ' + str(build) + '.')
          PY
          APK_NAME="melodiya-$(python3 -c "import json; print(json.load(open('melodiya-version.json'))['version'])")-$BUILD_NUMBER.apk"
          curl --fail --show-error --silent \
            -X POST "$SUPABASE_URL/storage/v1/object/melodiya-app-updates/$APK_NAME" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK"
          # Publish the manifest last so clients only see a build after its APK is uploaded.
          curl --fail --show-error --silent \
            -X POST "$SUPABASE_URL/storage/v1/object/melodiya-app-updates/version.json" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/json" \
            -H "Cache-Control: no-store" \
            --data-binary "@melodiya-version.json"
          echo "Published Melodiya build $BUILD_NUMBER to Supabase Storage."
